<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep dark #070612 with rounded corners -->
  <rect width="512" height="512" rx="112" fill="#070612"/>
  <!-- Purple inner glow rim -->
  <rect width="512" height="512" rx="112" fill="url(#rimGlow)" opacity="0.18"/>

  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- U monogram: large arc + checkmark inside -->
  <!-- U stroke: from top-left down, curve, up to top-right -->
  <path
    d="M152 136 L152 312 Q152 392 256 392 Q360 392 360 312 L360 136"
    stroke="url(#logoGrad)"
    stroke-width="52"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Checkmark inside the U -->
  <path
    d="M196 280 L238 326 L320 234"
    stroke="url(#logoGrad)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>